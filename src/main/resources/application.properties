# 认证与授权子系统配置（本地默认值，均可覆盖）
app.security.session-ttl=PT30M
app.security.access-token-ttl=PT10M
app.security.refresh-token-ttl=PT2H
app.security.allowed-origins=http://localhost:3000,http://127.0.0.1:3000
app.security.login-max-failures=5
app.security.login-failure-window=PT5M
app.security.login-lock-duration=PT10M
app.security.csrf-enabled=true

logging.level.com.github.h3yow.springauthzgatewayjava=INFO
logging.pattern.console=%d{HH:mm:ss.SSS} %-5level [%X{cid:-}] %logger{24} - %msg%n
