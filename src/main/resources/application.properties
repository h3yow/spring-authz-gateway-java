spring.application.name=spring-authz-gateway-java

# ---- 认证与授权子系统配置 ----
# 登录失败限流：窗口内最大失败次数、统计窗口、锁定时长
auth.login-max-failures=5
auth.login-failure-window=5m
auth.lockout-duration=10m
# 会话与令牌有效期
auth.session-ttl=30m
auth.access-token-ttl=10m
auth.refresh-token-ttl=12h
# CORS 允许来源（精确匹配，未声明来源不放行）
auth.allowed-origins=http://localhost:3000,http://127.0.0.1:3000

logging.level.com.github.h3yow.springauthzgatewayjava=INFO
